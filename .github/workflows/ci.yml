# CI: five jobs — lint (Python), lint-js, test, security, secrets-scan.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  lint-js:
    name: Lint (JS — Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
        # package-lock.json is gitignored (regenerable per .gitignore note),
        # so `npm ci` (which requires the lockfile) is replaced with `npm install`.
      - run: npx biome lint
        # biome.json restricts the lint surface to lucida.mjs + tools/*.mjs
        # + validate_mermaid.mjs. Globals (THREE / DOMPurify / vegaEmbed /
        # vega / vegaLite / d3 / Muuri / Prism) are declared there too.

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the scan
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # Project deps + test tooling. google-genai is optional ([image] extra)
        # and not required for the smoke tests.
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest tests/

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security tools
        run: pip install --upgrade pip bandit pip-audit
      - name: Bandit — static security analysis
        run: |
          bandit -r . \
            -x ./.venv,./tests,./research \
            --skip B101,B603,B607,B311 \
            -ll
        # B101: asserts (fine in tests)
        # B603/B607: subprocess intentional for orchestrator CLI hand-offs
        # B311: random for non-crypto (cell-id allocation, etc.)
      - name: pip-audit — dependency vulnerability scan
        run: pip-audit
