# CI lifted from drivermap (.github/workflows/ci.yml), trimmed for
# lucida's surface. Three jobs: lint, test, security. Per
# memory/python_conventions_adoption.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # Project deps + test tooling. google-genai is optional ([image] extra)
        # and not required for the smoke tests.
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest tests/

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security tools
        run: pip install --upgrade pip bandit pip-audit
      - name: Bandit — static security analysis
        run: |
          bandit -r . \
            -x ./.venv,./tests,./research \
            --skip B101,B603,B607,B311 \
            -ll
        # B101: asserts (fine in tests)
        # B603/B607: subprocess intentional for orchestrator CLI hand-offs
        # B311: random for non-crypto (cell-id allocation, etc.)
      - name: pip-audit — dependency vulnerability scan
        run: pip-audit
