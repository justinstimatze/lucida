# Pre-commit hooks. Run `pre-commit install` once after first checkout.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy intentionally NOT in pre-commit — CI runs ruff + pytest only.
  # Keeping mypy here would make pre-commit stricter than CI, blocking
  # local commits on pre-existing anthropic-SDK overload mismatches that
  # don't block CI. Run mypy on demand: `uv run mypy .`

  # Biome lint on the extracted JS module + tooling .mjs files.
  # Formatter intentionally disabled in biome.json — running it
  # retroactively against the 16k-line lucida.mjs would be ~5k lines of
  # whitespace churn. Lint catches actual bugs (use-before-define-class,
  # accidental implicit returns, etc.).
  - repo: local
    hooks:
      - id: biome-lint
        name: Biome lint (JS)
        entry: npx biome lint
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

      # File-size gate: Biome doesn't have a max-lines-per-file rule, so we
      # enforce one here. Catches future drift (no more silent 16k files).
      # Allowlist in the script — see task #70.
      - id: js-file-size
        name: JS file size limit (max-lines)
        entry: tools/check_js_file_sizes.sh
        language: system
        pass_filenames: false
        types_or: [javascript]

  # gitleaks: scan for accidentally committed secrets (API keys, tokens).
  # Matches the sibling-repo pattern (undercity / tttc-light-js); CI also
  # runs the full-history scan separately.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.0
    hooks:
      - id: gitleaks

  # Reference-still gate: copyrighted frames under refs/ must NEVER be
  # committed (this is a PUBLIC repo). 131 stills slipped past the old
  # per-dir gitignore list and had to be purged from history with
  # git-filter-repo on 2026-06-09. `language: fail` fails the commit if
  # any staged file matches. Prose (NOTES.md / ATTRIBUTION.md / README)
  # doesn't match the binary extensions, so curation stays committable.
  - repo: local
    hooks:
      - id: no-ref-stills
        name: Block media binaries under refs/
        entry: >-
          Copyrighted reference media must stay local-only (public repo).
          Unstage it; if intentional prose/code, rename outside refs/ or
          adjust .pre-commit-config.yaml.
        language: fail
        files: '^refs/.*\.(png|jpe?g|gif|webp|bmp|tiff?|mp4|mov|mkv|webm|ttf|otf|woff2?)$'
