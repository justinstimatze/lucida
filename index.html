<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>lucida notebook</title>
<link rel="stylesheet" href="notebook.css" />
<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
<!-- A-Frame bundles Three.js; we reuse window.THREE from it for scene3d cells -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js"></script>
<script>
  // Theme bootstrap -- runs synchronously in head to avoid FOUC.
  // Order: ?theme=<name>  >  cookie lucida_theme=<name>  >  "lab" (default).
  // Adapted from gemotvis/frontend/src/stores/theme.ts.
  (function () {
    var valid = ["lab", "magi", "minimal", "gastown"];
    var theme = "lab";
    try {
      var url = new URLSearchParams(window.location.search).get("theme");
      var m = document.cookie.match(/(?:^|; )lucida_theme=(\w+)/);
      if (url && valid.indexOf(url) >= 0) theme = url;
      else if (m && valid.indexOf(m[1]) >= 0) theme = m[1];
    } catch (e) { /* fall through to default */ }
    document.documentElement.classList.add("theme-" + theme);
    document.cookie = "lucida_theme=" + theme + "; path=/; max-age=" + (365 * 24 * 60 * 60) + "; SameSite=Lax";
    window.__LUCIDA_THEME = theme;
  })();
</script>
</head>
<body>
<header>
  <h1>lucida notebook</h1>
  <div id="hud" class="hud" aria-live="polite">
    <div class="hud-row hud-row-top">
      <span class="hud-cell hud-status">
        <span class="hud-label">STATUS</span>
        <span class="hud-value" id="hud-status-val">—</span>
        <span class="hud-pulse" id="hud-pulse"></span>
      </span>
      <span class="hud-cell hud-elapsed">
        <span class="hud-label">SINCE.LAST</span>
        <span class="hud-value" id="hud-elapsed-val">—</span>
      </span>
      <span class="hud-cell">
        <span class="hud-label">CELLS</span>
        <span class="hud-value" id="hud-cells-val">—</span>
      </span>
      <span class="hud-cell">
        <span class="hud-label">SESSION</span>
        <span class="hud-value" id="hud-session-val">—</span>
      </span>
      <span class="hud-cell">
        <span class="hud-label">THEME</span>
        <span class="hud-value" id="hud-theme-val">—</span>
      </span>
    </div>
    <div class="hud-row hud-row-bot">
      <span class="hud-cell hud-kills">
        <span class="hud-label">KILL.AESTHETIC</span>
        <span class="hud-value" id="hud-kill1-val">—</span>
      </span>
      <span class="hud-cell hud-kills">
        <span class="hud-label">KILL.MISROUTE</span>
        <span class="hud-value" id="hud-kill2-val">—</span>
      </span>
      <span class="hud-cell hud-kills">
        <span class="hud-label">KILL.HALLUC</span>
        <span class="hud-value" id="hud-kill3-val">—</span>
      </span>
      <span class="hud-cell hud-mints">
        <span class="hud-label">RECENT</span>
        <span class="hud-value" id="hud-recent-val">—</span>
      </span>
    </div>
    <div class="hud-scanline" aria-hidden="true"></div>
  </div>
</header>
<main id="notebook"></main>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

// Full-stack theme config: chrome lives in CSS (notebook.css), but
// mermaid + vega + scene3d/aframe content also need theme-aware colors.
// Active theme is set by the inline head script -> window.__LUCIDA_THEME.
const ACTIVE = window.__LUCIDA_THEME || "lab";

const THEME_CONFIG = {
  lab: {
    mermaid: { theme: "dark" },
    vega: { theme: "dark" },
    palette: {
      stroke1: "#00ffff", stroke2: "#ff00ff", stroke3: "#ffff00",
      accent: "#66ccff", fg: "#e5e5e5", muted: "#8a8a92",
      bg: "#0a0a0e", panel: "#131318",
    },
  },
  magi: {
    mermaid: {
      theme: "base",
      themeVariables: {
        background: "#050505",
        primaryColor: "#0c0c0c",
        primaryTextColor: "#ff8c00",
        primaryBorderColor: "#ff8c00",
        secondaryColor: "#0c0c0c",
        tertiaryColor: "#0c0c0c",
        mainBkg: "#0c0c0c",
        lineColor: "#00ff41",
        textColor: "#ff8c00",
        secondaryTextColor: "#ff8c00",
        tertiaryTextColor: "#ff8c00",
      },
    },
    vega: {
      config: {
        background: "transparent",
        title: { color: "#ff8c00", font: "Courier New" },
        axis: {
          domainColor: "#884600", labelColor: "#ff8c00",
          tickColor: "#884600", gridColor: "#2a2a2a",
          titleColor: "#ff8c00", labelFont: "Courier New",
          titleFont: "Courier New",
        },
        legend: { labelColor: "#ff8c00", titleColor: "#ff8c00" },
        range: { category: ["#ff8c00", "#00ff41", "#ff2020", "#4488ff", "#ffff00", "#ff00ff"] },
      },
    },
    palette: {
      stroke1: "#ff8c00", stroke2: "#00ff41", stroke3: "#ff2020",
      accent: "#00ff41", fg: "#ff8c00", muted: "#884600",
      bg: "#050505", panel: "#0c0c0c",
    },
  },
  minimal: {
    mermaid: { theme: "neutral" },
    vega: {},
    palette: {
      stroke1: "#0070f3", stroke2: "#737373", stroke3: "#171717",
      accent: "#0070f3", fg: "#171717", muted: "#737373",
      bg: "#ffffff", panel: "#f7f7f7",
    },
  },
  gastown: {
    mermaid: {
      theme: "base",
      themeVariables: {
        primaryColor: "#f5e6d3",
        primaryTextColor: "#2c1810",
        primaryBorderColor: "#cd7f32",
        lineColor: "#8b5e3c",
        textColor: "#2c1810",
        mainBkg: "#f5e6d3",
        secondaryColor: "#e8dcc8",
      },
    },
    vega: {
      config: {
        background: "transparent",
        title: { color: "#2c1810", font: "Crimson Text" },
        axis: {
          domainColor: "#5d4037", labelColor: "#2c1810",
          tickColor: "#5d4037", titleColor: "#2c1810",
          labelFont: "Crimson Text", titleFont: "Crimson Text",
        },
        legend: { labelColor: "#2c1810", titleColor: "#2c1810" },
        range: { category: ["#cd7f32", "#8b5e3c", "#b87333", "#5d4037", "#70798c", "#a0522d"] },
      },
    },
    palette: {
      stroke1: "#cd7f32", stroke2: "#8b5e3c", stroke3: "#5d4037",
      accent: "#cd7f32", fg: "#2c1810", muted: "#5d4037",
      bg: "#e8dcc8", panel: "#f5e6d3",
    },
  },
};

const TC = THEME_CONFIG[ACTIVE] || THEME_CONFIG.lab;

mermaid.initialize({ startOnLoad: false, ...TC.mermaid });

// Pause off-screen 3D content (Three.js render loops, A-Frame scenes) via
// IntersectionObserver. Multiple live WebGL contexts in one page wedge the
// render thread; this only animates what's visible.
function pauseOffScreen(targetEl, onShow, onHide) {
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting) onShow();
      else onHide();
    }
  }, { rootMargin: "200px" });
  io.observe(targetEl);
}

// Token expansion for cell specs: $accent, $stroke1, $stroke2, $stroke3,
// $fg, $muted, $bg, $panel. Substituted before innerHTML / scene3d render
// so cell content re-colors with theme.
function expandTokens(s) {
  if (typeof s !== "string") return s;
  return s.replace(/\$(\w+)/g, (m, name) => TC.palette[name] || m);
}
function resolveColor(c) {
  if (typeof c !== "string") return c;
  if (c.startsWith("$")) {
    const name = c.slice(1);
    return TC.palette[name] || c;
  }
  return c;
}

// Type-on animation: progressively reveal text into a target element.
// Hackertyper-feel; bounded so first paint isn't a blocking effect.
// Critical: only animates when the value actually CHANGES — otherwise
// the 5s HUD poll would re-type the entire header every tick, which
// reads as nervous flicker, not signal.
const _lastTyped = new Map();
function typeInto(elId, text, perChar = 18, maxChars = 200) {
  const e = document.getElementById(elId);
  if (!e) return;
  const t = String(text).slice(0, maxChars);
  if (_lastTyped.get(elId) === t) return;  // unchanged → leave it alone
  _lastTyped.set(elId, t);
  e.textContent = "";
  let i = 0;
  const tick = () => {
    e.textContent = t.slice(0, ++i);
    if (i < t.length) setTimeout(tick, perChar);
  };
  tick();
}

async function fetchJSON(path) {
  try {
    const r = await fetch(path, { cache: "no-store" });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}
async function fetchText(path) {
  try {
    const r = await fetch(path, { cache: "no-store" });
    if (!r.ok) return null;
    return await r.text();
  } catch (e) { return null; }
}

// Compute lucida HUD metrics from cells.json + the latest substrate eval.
// Kill rates use audited values when present, else fall back to cells.json
// regex / proxy heuristics so the strip never reads "—".
function computeHud(data, substrateAudit, mintLog) {
  const cells = data.cells || [];
  const active = cells.filter(c => !c.replaced_by);
  const visible = active.filter(c => !(c.cell_type === "text" && c.attempted_cell_type));
  const byType = {};
  for (const c of visible) byType[c.cell_type] = (byType[c.cell_type] || 0) + 1;

  // KILL.AESTHETIC — kill #1, image quality. Proxy: count image cells whose notes mention low score.
  // For the audit, we'd read audits/audit_*.md; for now use the rate from the existing audit_2026-04-27 figures.
  let kill1 = "n/a";
  const imgCells = visible.filter(c => c.cell_type === "image");
  if (imgCells.length) kill1 = `img ${imgCells.length} (audit Δ pending)`;

  // KILL.MISROUTE — classifier mis-routings. Pull from notes via regex.
  const forced = active.filter(c => /forced→\w+/.test(c.notes || ""));
  const total = active.length;
  const kill2pct = total ? (forced.length * 100 / total).toFixed(1) : "0.0";
  const kill2 = `${kill2pct}% (${forced.length}/${total})`;

  // KILL.HALLUC — substrate hallucination from latest audit.
  let kill3 = "n/a";
  if (substrateAudit && substrateAudit.length) {
    const evaluated = substrateAudit.filter(r => !r.error);
    const inv = evaluated.filter(r => (r.substrate_inv && r.substrate_inv.length) || (r.caption_inv && r.caption_inv.length));
    const pct = evaluated.length ? (inv.length * 100 / evaluated.length).toFixed(1) : "0.0";
    kill3 = `${pct}% (${inv.length}/${evaluated.length})`;
  }

  // STATUS — alive if any mint within last 60min, else idle.
  let status = "IDLE";
  let lastMint = null;
  if (mintLog && mintLog.length) {
    const now = Date.now();
    const recent = mintLog.filter(m => {
      const t = Date.parse(m.timestamp || "");
      return !isNaN(t) && (now - t) < 60 * 60 * 1000;
    });
    if (recent.length) status = "ACTIVE";
    lastMint = mintLog[mintLog.length - 1];
  }

  // RECENT — last 3 mints, comma-separated.
  let recent = "—";
  if (mintLog && mintLog.length) {
    const last3 = mintLog.slice(-3).map(m => `${m.cell_id}:${m.cell_type}`);
    recent = last3.join("  ");
  }

  return {
    status,
    cells: `${visible.length}  [${Object.entries(byType).map(([t, n]) => `${t}:${n}`).join("·")}]`,
    session: (data.session_id || "—").slice(0, 8),
    theme: (window.__LUCIDA_THEME || "lab").toUpperCase(),
    kill1, kill2, kill3, recent,
  };
}

// Parse mint_log.jsonl (one JSON object per line) into an array.
function parseMintLog(text) {
  if (!text) return [];
  return text.split(/\r?\n/).filter(Boolean).map(line => {
    try { return JSON.parse(line); } catch (e) { return null; }
  }).filter(Boolean);
}

// Track latest seen mint so we can detect *new* events between polls
// and flash the HUD to announce them. Persists across loadHud calls.
let _lastSeenMintCellId = null;
let _lastMintTimestamp = null;  // for the live seconds-since-last counter

// Set of cell IDs already rendered in the notebook. Initialized by the
// first load() pass and grown by liveAppendNewCells() as fresh cells arrive.
const _renderedCellIds = new Set();

// Detect cells in cells.json that haven't been rendered yet, append them
// to the notebook with a slide-in animation. Called from loadHud() so it
// runs at the same 1.5s cadence as the HUD poll.
function liveAppendNewCells(cellsData) {
  if (!cellsData || !Array.isArray(cellsData.cells)) return 0;
  const visible = cellsData.cells.filter(c => {
    if (c.cell_type === "text" && c.attempted_cell_type) return false;
    if (c.replaced_by) return false;
    return true;
  });
  // First poll establishes the baseline; subsequent polls detect deltas.
  // load() seeds _renderedCellIds before the first poll fires.
  const fresh = visible.filter(c => !_renderedCellIds.has(c.id));
  if (!fresh.length) return 0;

  // Rebuild snippetGroups from the full visible set so attempt-N-of-M
  // badges include the newly arrived cells.
  const snippetGroups = new Map();
  for (const c of visible) {
    if (!c.trigger_snippet) continue;
    if (!snippetGroups.has(c.trigger_snippet)) snippetGroups.set(c.trigger_snippet, []);
    snippetGroups.get(c.trigger_snippet).push(c.id);
  }

  const root = document.getElementById("notebook");
  for (const c of fresh) {
    const node = renderCell(c, snippetGroups);
    node.classList.add("cell-fresh");
    root.appendChild(node);
    _renderedCellIds.add(c.id);
    // Strip the animation class after it plays so re-flows don't replay.
    setTimeout(() => node.classList.remove("cell-fresh"), 1400);
  }
  return fresh.length;
}

async function loadHud() {
  const [cellsData, mintLogText] = await Promise.all([
    fetchJSON("cells.json"),
    fetchText("mint_log.jsonl"),
  ]);
  if (!cellsData) return;

  // Live append before computing HUD metrics so the cell count + flash
  // reflect the new state.
  const appended = liveAppendNewCells(cellsData);
  if (appended) flashHud();

  // Pick latest substrate eval if present; renderer doesn't know which date.
  let substrateAudit = null;
  for (const d of ["2026-04-27"]) {
    const a = await fetchJSON(`audits/substrate_eval_${d}.json`);
    if (a) { substrateAudit = a; break; }
  }

  const mintLog = parseMintLog(mintLogText);
  const newest = mintLog.length ? mintLog[mintLog.length - 1] : null;

  // Detect new mint vs. last poll → flash HUD and re-render notebook tail.
  if (newest && newest.cell_id && newest.cell_id !== _lastSeenMintCellId) {
    if (_lastSeenMintCellId !== null) flashHud();  // skip flash on first paint
    _lastSeenMintCellId = newest.cell_id;
  }
  _lastMintTimestamp = newest ? newest.timestamp : null;

  const m = computeHud(cellsData, substrateAudit, mintLog);
  typeInto("hud-status-val", m.status);
  typeInto("hud-cells-val", m.cells);
  typeInto("hud-session-val", m.session);
  typeInto("hud-theme-val", m.theme);
  typeInto("hud-kill1-val", m.kill1);
  typeInto("hud-kill2-val", m.kill2);
  typeInto("hud-kill3-val", m.kill3);
  typeInto("hud-recent-val", m.recent);
  const hud = document.getElementById("hud");
  hud.dataset.status = m.status.toLowerCase();
}

function flashHud() {
  const hud = document.getElementById("hud");
  hud.classList.add("hud-flash");
  setTimeout(() => hud.classList.remove("hud-flash"), 700);
}

// Live elapsed-since-last-mint tick. Updates a dedicated SINCE.LAST slot
// every second so the HUD feels alive between polls without fighting the
// loadHud poll over the STATUS slot. Direct textContent mutation; no
// typeInto, no animation. The pulse dot still encodes activity recency
// via the hud[data-status] attribute set by loadHud.
function tickSinceLast() {
  const e = document.getElementById("hud-elapsed-val");
  if (!e) return;
  if (!_lastMintTimestamp) { e.textContent = "—"; return; }
  const t = Date.parse(_lastMintTimestamp);
  if (isNaN(t)) { e.textContent = "—"; return; }
  const sec = Math.max(0, Math.floor((Date.now() - t) / 1000));
  e.textContent = formatElapsed(sec);
}

function formatElapsed(sec) {
  if (sec < 60) return `${sec}s`;
  if (sec < 3600) return `${Math.floor(sec / 60)}m${sec % 60}s`;
  if (sec < 86400) return `${Math.floor(sec / 3600)}h${Math.floor((sec % 3600) / 60)}m`;
  return `${Math.floor(sec / 86400)}d`;
}

async function load() {
  const res = await fetch("cells.json", { cache: "no-store" });
  const data = await res.json();
  const visible = data.cells.filter(c => {
    if (c.cell_type === "text" && c.attempted_cell_type) return false;  // demoted by trivial-filter
    if (c.replaced_by) return false;                                     // superseded by a retrigger
    return true;
  });

  // Group cells that share a trigger_snippet so each can render as
  // "attempt N of M" rather than appearing as accidental duplicates.
  const snippetGroups = new Map();
  for (const c of visible) {
    if (!c.trigger_snippet) continue;
    if (!snippetGroups.has(c.trigger_snippet)) snippetGroups.set(c.trigger_snippet, []);
    snippetGroups.get(c.trigger_snippet).push(c.id);
  }

  const root = document.getElementById("notebook");
  for (const c of visible) {
    root.appendChild(renderCell(c, snippetGroups));
    _renderedCellIds.add(c.id);  // seed live-append baseline
  }
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderCell(c, snippetGroups) {
  const card = el("article", "cell");
  if (c.id) card.id = c.id;
  const sources = Array.isArray(c.reflection_source_ids) ? c.reflection_source_ids : [];
  if (sources.length > 0) {
    card.classList.add("cell-reflection");
  }
  const head = el("div", "cell-head");
  head.appendChild(el("span", "cell-type", c.cell_type));
  head.appendChild(el("span", "cell-id", c.id || ""));
  if (snippetGroups && c.trigger_snippet) {
    const group = snippetGroups.get(c.trigger_snippet);
    if (group && group.length > 1) {
      const idx = group.indexOf(c.id);
      head.appendChild(el("span", "cell-attempt-badge",
        `attempt ${idx + 1} of ${group.length}`));
    }
  }
  head.appendChild(el("span", "cell-time", c.timestamp || ""));
  card.appendChild(head);

  if (sources.length > 0) {
    const srcRow = el("div", "cell-reflection-sources");
    srcRow.appendChild(el("span", "cell-reflection-sources-label", "reflecting on"));
    for (const sid of sources) {
      const a = el("a", "cell-reflection-source-chip", sid);
      a.href = "#" + sid;
      srcRow.appendChild(a);
    }
    card.appendChild(srcRow);
  }

  if (c.trigger_snippet) {
    const trig = el("div", "cell-trigger");
    trig.appendChild(el("div", "cell-trigger-label", "trigger snippet"));
    trig.appendChild(el("pre", null, c.trigger_snippet));
    card.appendChild(trig);
  }

  if (c.prompt) {
    const p = el("details", "cell-prompt");
    p.appendChild(el("summary", null, "prompt"));
    p.appendChild(el("pre", null, c.prompt));
    card.appendChild(p);
  }

  const body = el("div", "cell-body");
  card.appendChild(body);

  if (c.cell_type === "image" && c.image_path) {
    const img = el("img");
    img.src = c.image_path;
    img.alt = c.caption || "generated image";
    body.appendChild(img);
  } else if (c.cell_type === "vega" && c.spec) {
    const target = el("div", "vega-target");
    body.appendChild(target);
    vegaEmbed(target, c.spec, { actions: false, ...TC.vega }).catch(err => {
      target.textContent = "vega render error: " + err.message;
    });
  } else if (c.cell_type === "mermaid" && c.spec) {
    const target = el("div", "mermaid-target");
    body.appendChild(target);
    mermaid.render(`m-${c.id}`, c.spec).then(({ svg }) => {
      target.innerHTML = svg;
    }).catch(err => {
      target.textContent = "mermaid render error: " + err.message;
    });
  } else if (c.cell_type === "html" && c.html) {
    body.innerHTML = c.html;
  } else if (c.cell_type === "animated_svg" && c.spec) {
    const target = el("div", "svg-target");
    target.innerHTML = expandTokens(c.spec);
    body.appendChild(target);
  } else if (c.cell_type === "scene3d" && c.spec) {
    // Lazy: only create the Three.js renderer + scene when the cell
    // first scrolls into viewport. Off-screen cells stay as empty divs
    // so initial-load GPU pressure scales with what's visible, not with
    // total cells in the notebook.
    const target = el("div", "scene3d-target");
    body.appendChild(target);
    let ctrl = null;
    pauseOffScreen(
      target,
      () => {
        if (!ctrl) ctrl = initScene3D(target, c.spec);
        if (ctrl) ctrl.play();
      },
      () => { if (ctrl) ctrl.pause(); },
    );
  } else if (c.cell_type === "aframe" && c.spec) {
    // Lazy: defer the <a-scene> insertion (and the implicit A-Frame
    // initialization that follows) until the cell enters viewport.
    const target = el("div", "aframe-target");
    body.appendChild(target);
    let initialized = false;
    let sceneEl = null;
    pauseOffScreen(
      target,
      () => {
        if (!initialized) {
          initialized = true;
          const trimmed = expandTokens(c.spec).trim();
          const wrapped = trimmed.startsWith("<a-scene")
            ? trimmed
            : `<a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true">${trimmed}</a-scene>`;
          target.innerHTML = wrapped;
          // After A-Frame parses + initializes, strip its UI chrome.
          setTimeout(() => {
            const stripSel = ".a-enter-vr, .a-orientation-modal, .a-loader-title, .a-modal, .a-fullscreen-button";
            target.querySelectorAll(stripSel).forEach(el => el.remove());
            sceneEl = target.querySelector("a-scene");
            if (sceneEl) {
              sceneEl.querySelectorAll(stripSel).forEach(el => el.remove());
            }
          }, 500);
        } else if (sceneEl) {
          try { sceneEl.play && sceneEl.play(); } catch (e) {}
        }
      },
      () => {
        if (sceneEl) {
          try { sceneEl.pause && sceneEl.pause(); } catch (e) {}
        }
      },
    );
  } else if (c.cell_type === "lottie" && c.spec) {
    const target = el("div", "lottie-target");
    body.appendChild(target);
    setTimeout(() => {
      if (typeof lottie === "undefined") {
        target.textContent = "lottie library not loaded";
        return;
      }
      if (c.spec && c.spec._skip) {
        target.textContent = `(lottie skipped: ${c.spec.reason || "no spec"})`;
        return;
      }
      try {
        lottie.loadAnimation({
          container: target,
          renderer: "svg",
          loop: true,
          autoplay: true,
          animationData: c.spec,
        });
      } catch (err) {
        target.textContent = "lottie render error: " + err.message;
      }
    }, 0);
  } else if (c.cell_type === "text" && c.caption) {
    // caption-only renders below
  } else if (c.classifier_reasoning || c.confidence !== null) {
    // Proposal cell: classifier metadata exists but no spec/html/image yet.
    // Surface the reasoning so the cell isn't visually broken-looking.
    const proposal = el("div", "cell-proposal");
    const labelText = c.confidence != null
      ? `proposal — awaiting ${c.cell_type} spec  ·  confidence ${c.confidence.toFixed(2)}`
      : `proposal — awaiting ${c.cell_type} spec`;
    proposal.appendChild(el("div", "cell-proposal-label", labelText));
    if (c.classifier_reasoning) {
      proposal.appendChild(el("div", "cell-proposal-reasoning", c.classifier_reasoning));
    }
    body.appendChild(proposal);
  } else {
    body.appendChild(el("div", "cell-empty", "(no content for this cell)"));
  }

  if (c.caption) {
    card.appendChild(el("div", "cell-caption", c.caption));
  }

  if (c.notes !== undefined) {
    const n = el("div", "cell-notes");
    n.appendChild(el("strong", null, "notes: "));
    const text = c.notes || "(unrated)";
    const parts = text.split(/(\bcell-\d{4}\b)/g);
    for (const part of parts) {
      if (/^cell-\d{4}$/.test(part)) {
        const a = el("a", "cell-id-link", part);
        a.href = "#" + part;
        n.appendChild(a);
      } else if (part) {
        n.appendChild(document.createTextNode(part));
      }
    }
    card.appendChild(n);
  }

  return card;
}

function initScene3D(container, spec) {
  const T = window.THREE || (window.AFRAME && window.AFRAME.THREE);
  if (!T) {
    container.textContent = "Three.js not available (A-Frame failed to load?)";
    return null;
  }
  const w = container.clientWidth || 600;
  const h = 360;
  const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  const bg = spec.background;
  if (bg && bg !== "transparent") {
    renderer.setClearColor(bg, 1);
  } else {
    renderer.setClearColor(0x000000, 0);
  }
  container.appendChild(renderer.domElement);

  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(50, w / h, 0.1, 100);
  camera.position.set(0, 0, spec.camera_distance || 5);

  const animatables = [];
  for (const obj of (spec.objects || [])) {
    let mesh = null;
    const color = new T.Color(resolveColor(obj.color) || "#ffffff");
    const size = obj.size || 1;
    if (obj.kind === "wireframe_cube") {
      const geo = new T.BoxGeometry(size, size, size);
      mesh = new T.LineSegments(new T.WireframeGeometry(geo),
        new T.LineBasicMaterial({ color }));
    } else if (obj.kind === "wireframe_sphere") {
      const geo = new T.SphereGeometry(size, 16, 12);
      mesh = new T.LineSegments(new T.WireframeGeometry(geo),
        new T.LineBasicMaterial({ color }));
    } else if (obj.kind === "torus") {
      const geo = new T.TorusGeometry(size, size * 0.3, 8, 24);
      mesh = new T.Mesh(geo, new T.MeshBasicMaterial({ color, wireframe: true }));
    } else if (obj.kind === "icosahedron") {
      const geo = new T.IcosahedronGeometry(size, 0);
      mesh = new T.Mesh(geo, new T.MeshBasicMaterial({ color, wireframe: true }));
    } else if (obj.kind === "axis_helper") {
      mesh = new T.AxesHelper(size);
    } else if (obj.kind === "particle_cloud") {
      const geo = new T.BufferGeometry();
      const positions = [];
      const count = obj.count || 100;
      const spread = obj.spread || 3;
      for (let i = 0; i < count; i++) {
        positions.push((Math.random() - 0.5) * spread * 2);
        positions.push((Math.random() - 0.5) * spread * 2);
        positions.push((Math.random() - 0.5) * spread * 2);
      }
      geo.setAttribute("position", new T.Float32BufferAttribute(positions, 3));
      mesh = new T.Points(geo, new T.PointsMaterial({ color, size: 0.05 }));
    }
    if (mesh) {
      if (Array.isArray(obj.position)) mesh.position.set(...obj.position);
      scene.add(mesh);
      if (Array.isArray(obj.rotation_speed)) {
        animatables.push({ mesh, speed: obj.rotation_speed });
      }
    }
  }

  // Render loop is play/pause-able via the returned controller; the caller
  // wires it to an IntersectionObserver so off-screen scenes don't compete
  // for the GPU thread.
  let running = false;
  function animate() {
    if (!running) return;
    requestAnimationFrame(animate);
    for (const a of animatables) {
      a.mesh.rotation.x += a.speed[0] || 0;
      a.mesh.rotation.y += a.speed[1] || 0;
      a.mesh.rotation.z += a.speed[2] || 0;
    }
    renderer.render(scene, camera);
  }
  return {
    play() { if (!running) { running = true; animate(); } },
    pause() { running = false; },
  };
}

load().catch(err => {
  document.getElementById("notebook").textContent =
    "load error: " + err.message;
});

// HUD bootstraps and polls fast. Hackertyper-feel reveal happens
// inside typeInto() but only on actual value changes (cached), so the
// poll cadence doesn't cause header flicker. The since-last-mint
// counter ticks every second so the HUD feels alive even between polls.
loadHud().catch(() => {});
setInterval(() => loadHud().catch(() => {}), 1500);
setInterval(tickSinceLast, 1000);
</script>
