<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Force browsers to always re-fetch index.html. Without this, the
     dev cycle hits cache surprises: hard refresh / Shift+Reload
     bypasses cache for one navigation, but back-button or "regular"
     reload can serve a stale document. Lucida is dev-server-served
     and tiny, so disabling cache is fine here. -->
<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Lucida</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="notebook.css?v=160" />
<!--
  CDN scripts pinned with SRI (sha384) for supply-chain integrity.
  Computed 2026-05-25. If a CDN updates a non-pinned major (e.g. vega@5
  → newer 5.x), the integrity check will fail-fast and the script won't
  load. Refresh the hashes after a deliberate version bump.

  DOMPurify loaded first so the cell-rendering paths can sanitize LLM-
  emitted html/svg before innerHTML — prevents prompt-injected cells
  from running arbitrary JS in the dashboard.
-->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"
        integrity="sha384-Ic7KEGROu37YaruU6NyiYeib7UhjFyDZQ5fzBAji965L75T/4LGk5nzwMEjNGexs"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/vega@5"
        integrity="sha384-NMXhl2TbCXxcN7o4ROC56Funm78m4AylL8gMg/7Kn4YU+wrm23K9l7cY8lDRXQ9d"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"
        integrity="sha384-D9LYH0esGjcxQJsBuxOuXtCDJGXRWW1+KhluzWPqi0rLJmiR/ygPChefaD+rFFDQ"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"

<!-- Three.js loaded eagerly for scene3d cells. -->

<script src="vendor/CSS3DRenderer.js"></script>
<!-- d3-hierarchy: canonical squarified treemap (Bruls 2000). Replaces

        crossorigin="anonymous"></script>
<!-- d3-force + d3-dispatch + d3-quadtree + d3-timer: canonical Verlet
     spring layout for force_graph cells. Pulls in just the force module
     family (~10KB combined) — not the full d3 bundle. Used for entity-
     mesh snippets where mermaid would render a hairball. -->
<script src="https://cdn.jsdelivr.net/npm/d3-dispatch@3"
        integrity="sha384-oGUk7ZMuIJXyjegrWZrjUkxuWZHJoUPTeaUNKzjcEhND8HzfagI4EnXVspF2mP60"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-timer@3"
        integrity="sha384-brChTSJXF1bpEGi+e8fNotmiEQtehLbv5EWt3njlDFlYjl/SwmXs4xofe0gvWd7E"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-quadtree@3"
        integrity="sha384-JzQQZeN94rbeGRpksNSu8TCkRWLlzTHev53JZngDT0faxrmd9bApgXS5pZWShqJb"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-force@3"
        integrity="sha384-RM+ykRJc5/xPC56TVMOAYbZeVThoKXqcRlmRHZZc3YDHDCvFJrsEH2dpLMqL50K8"
        crossorigin="anonymous"></script>
<!-- Muuri: bin-packing layout engine. Used by the `pack` layout mode to
     subsume the old grid+treemap behavior with rock-sand density: cells
     keep their natural sizes (no proportional squish like treemap) and
     small cells fill gaps under tall ones (fixing wasted-whitespace under
     CSS auto-fit). fillGaps:true rearranges out-of-order *only when it
     produces denser packing*. ~50KB. -->
<script src="https://cdn.jsdelivr.net/npm/muuri@0.9.5/dist/muuri.min.js"
        integrity="sha384-pjx/ohA+FGGT1DkH8NeTscW3x2H82LwvD4gfQIvtJ8JY5UjIdU82eel4/J5pCj8D"
        crossorigin="anonymous"></script>
<script>
  // Single source of truth for themes. Defined in head so the bootstrap
  // below (and any subsequent head/deferred-module code) can derive both
  // the URL/cookie allowlist AND the dropdown rows from one object.
  // Closes the prior "add a theme, forget to update the bootstrap valid[]"
  // tripwire. Per-theme fields (hud / furniture / transient / motion) are
  // attached by the main module after function declarations land.
  // Per-theme fields:
  //   id, label, description       — dropdown / HUD chip text
  //   hud                          — faction-flavored HUD chip labels
  //                                  (status / since / cells / render / session).
  //                                  Missing → defaults stay. layout/theme labels
  //                                  are always canonical "LAYOUT"/"THEME".
  //   furniture                    — name of a _buildFurniture* function (mapped
  //                                  via FURNITURE_BUILDERS in main module).
  //                                  Themes can share a builder (mars-red reuses
  //                                  mars-blue's MCRN bezel). Missing → no-op.
  //   transient                    — name of a _buildTransient* function (mapped
  //                                  via TRANSIENT_BUILDERS). Missing → generic.
  //   motion                       — transient cell motion mode ("pack" default).
  window.THEME_REGISTRY = {
    lab:       { id: "lab",       label: "LAB",       description: "cyan/magenta on near-black; default",
                 transient: "lab" },
    conclave:  { id: "conclave",  label: "CONCLAVE",  description: "amber + green three-machine consensus",
                 hud: { status: "MAGI", since: "CYCLE", cells: "SOULS", render: "ANALYSIS", session: "RITUAL" },
                 transient: "conclave" },
    minimal:   { id: "minimal",   label: "MINIMAL",   description: "Vercel/Linear clean light",
                 transient: "minimal" },
    gastown:   { id: "gastown",   label: "GASTOWN",   description: "steampunk brass on cream serif",
                 hud: { status: "CHROME", since: "REVS", cells: "GUZZ", render: "ROAR", session: "CONVOY" },
                 transient: "gastown" },
    ops:       { id: "ops",       label: "OPS",       description: "color-band operations board, condensed display",
                 hud: { status: "COND", since: "T+", cells: "CONTACTS", render: "COMPUTING", session: "WATCH" },
                 transient: "ops" },
    vigil:     { id: "vigil",     label: "VIGIL",     description: "cold electric cyan on void black — always watching",
                 hud: { status: "VITAL", since: "UPTIME", cells: "TARGETS", render: "COMP", session: "WATCH" },
                 transient: "vigil" },
    circuit:   { id: "circuit",   label: "CIRCUIT",   description: "teal-blue + orange binary on pure black",
                 hud: { status: "PWR", since: "CYCLE", cells: "BITS", render: "RENDER", session: "CONN" },
                 transient: "circuit" },
    noir:      { id: "noir",      label: "NOIR",      description: "amber hologram on rain-soaked blue-black",
                 hud: { status: "PULSE", since: "T+", cells: "LEADS", render: "INK", session: "CASE" },
                 transient: "noir" },
    renegade:  { id: "renegade",  label: "RENEGADE",  description: "omnitool orange + nav cyan on warm-black",
                 hud: { status: "CON", since: "ETA", cells: "CONTACTS", render: "OMNI", session: "WATCH" },
                 transient: "renegade" },
    mainframe: { id: "mainframe", label: "MAINFRAME", description: "neon aqua city grid, Game Cube purple accent",
                 hud: { status: "STAT", since: "UP", cells: "RECORDS", render: "EXEC", session: "JOB" },
                 transient: "mainframe" },
    terminus:  { id: "terminus",  label: "TERMINUS",  description: "phosphor on black — end of the line",
                 hud: { status: "PWR", since: "T+", cells: "LINES", render: "ECHO", session: "SESSION" },
                 transient: "terminus" },
    hackers:   { id: "hackers",   label: "HACKERS",   description: "Gibson canyon — cyan glass towers, void beneath",
                 hud: { status: "PWR", since: "UPTIME", cells: "FILES", render: "GIBSON", session: "RUN" } },
    hailmary:  { id: "hailmary",  label: "HAILMARY",  description: "Project Hail Mary blueprint — wireframe ship + pill chips",
                 hud: { status: "VITAL", since: "AU", cells: "SPECIMENS", render: "SCAN", session: "LOG" } },
    "mars-blue": { id: "mars-blue", label: "MARS BLUE", description: "Mars-style command-line — system-color triad, cyan tactical, red under-the-hood",
                 hud: { status: "CON", since: "T+", cells: "CONTACTS", render: "RENDR", session: "WATCH" },
                 furniture: "mars-blue", transient: "mars-blue" },
    "mars-red":  { id: "mars-red",  label: "MARS RED",  description: "Classic Mars — gunmetal grey hull, red-primary tactical, hard angular",
                 hud: { status: "CON", since: "T+", cells: "CONTACTS", render: "RENDR", session: "WATCH" },
                 furniture: "mars-blue" },
    drift:     { id: "drift",     label: "DRIFT",     description: "Outer-rim salvage — amber+cyan dual accent, warm-brown, eclectic/improvised",
                 hud: { status: "STA", since: "TIM", cells: "KONTAKT", render: "RENDR", session: "WACH" },
                 furniture: "drift", transient: "drift" },
    earth:     { id: "earth",     label: "EARTH",     description: "Earth navy — institutional royal-blue, deliberately plain/utilitarian",
                 hud: { status: "CONDITION", since: "ELAPSED", cells: "CONTACTS", render: "RENDR", session: "WATCH" },
                 furniture: "earth", transient: "earth" },
  };
</script>
<script>
  // Theme bootstrap -- runs synchronously in head to avoid FOUC.
  // Order: ?theme=<name>  >  cookie lucida_theme=<name>  >  "lab" (default).
  // Adapted from gemotvis/frontend/src/stores/theme.ts.
  (function () {
    var valid = Object.keys(window.THEME_REGISTRY);
    var theme = "lab";
    try {
      var url = new URLSearchParams(window.location.search).get("theme");
      var m = document.cookie.match(/(?:^|; )lucida_theme=([\w-]+)/);
      if (url && valid.indexOf(url) >= 0) theme = url;
      else if (m && valid.indexOf(m[1]) >= 0) theme = m[1];
    } catch (e) { /* fall through to default */ }
    document.documentElement.classList.add("theme-" + theme);
    document.cookie = "lucida_theme=" + theme + "; path=/; max-age=" + (365 * 24 * 60 * 60) + "; SameSite=Lax";
    window.__LUCIDA_THEME = theme;
    // Pre-set body.layout-mixed3d when URL declares it, so the
    // CSS rule that hides scene3d cells (which would otherwise
    // race to allocate WebGL contexts during initial cell render)
    // applies before load() runs. Body element doesn't exist yet
    // here; run on DOMContentLoaded.
    try {
      var layout = new URLSearchParams(window.location.search).get("layout");
      if (layout === "mixed3d") {
        document.addEventListener("DOMContentLoaded", function () {
          document.body.classList.add("layout-mixed3d");
        });
      }
      // Boot overlay fade-out: mixed3d signals 'booted' from its own
      // first-frame callback (slow path — wait for WebGL warm). All
      // other layouts hide the overlay on window-load + one rAF, since
      // they don't have a comparable warmup cost.
      window.addEventListener("load", function () {
        if (layout !== "mixed3d") {
          requestAnimationFrame(function () {
            document.body.classList.add("booted");
          });
        }
        // Safety fallback: force-hide after 90 seconds if the warmup
        // path never even begins (e.g. mount drain stuck). Healthy boot
        // dismisses MUCH earlier via the boot-ready promise that warmup
        // resolves once a quota of camera-visible cells are warm.
        // Sized for: 1248-cell mount drain (~37s) + stable-frame wait
        // (~25s) + warmup-quota (~5-10s) ≈ 70s typical; 90s gives slack
        // before declaring init broken. Cancelled when warmup starts.
        window._mixed3dSafetyBootId = setTimeout(function () {
          document.body.classList.add("booted");
        }, 90000);
        window._mixed3dCancelSafetyBoot = function () {
          if (window._mixed3dSafetyBootId) {
            clearTimeout(window._mixed3dSafetyBootId);
            window._mixed3dSafetyBootId = null;
          }
        };
      });
    } catch (e) { /* swallow */ }
  })();
</script>
</head>
<body>
<!-- Boot overlay: visible by default via CSS, hidden by JS once
     applyMixed3DLayout has done its first WebGL render (or any other
     layout has finished mounting). Without this the first ~3 seconds
     of page load look "rough" — fonts loading, WebGL context warming,
     scene construction visibly happening, cells popping in. User
     2026-05-02. -->
<div id="boot-overlay">
  <div class="boot-content">
    <div class="boot-title">INITIALIZING</div>
    <div class="boot-bar"><div class="boot-bar-fill"></div></div>
    <div class="boot-counter"></div>
  </div>
</div>
<header>
  <!-- Page title removed from on-page chrome: static chrome that
       doesn't earn its keep on a glanceable page. Per
       memory/feedback_glanceable_no_clicks and the user's "only
       consistently useful content should remain on the viz page".
       The browser tab's <title> says "Lucida" so window-switching
       identification is preserved. -->
  <!-- Edge-trigger activation zone for the HUD. 32px tall (generous —
       friendly), top-pinned, pointer-events on. Slow-pulsing accent
       line gives a discoverable hint that there is something above the
       fold without occupying visible header space.  See #setupHudEdgeTrigger. -->
  <div id="hud-edge-hint" aria-hidden="true"></div>
  <div id="hud" class="hud" aria-live="polite">
    <div class="hud-row hud-row-top">
      <span class="hud-cell hud-status">
        <span class="hud-label">STATUS</span>
        <span class="hud-value" id="hud-status-val">—</span>
        <span class="hud-pulse" id="hud-pulse"></span>
      </span>
      <span class="hud-cell hud-elapsed">
        <span class="hud-label">SINCE.LAST</span>
        <span class="hud-value" id="hud-elapsed-val">—</span>
      </span>
      <span class="hud-cell hud-cells-cell">
        <span class="hud-label">CELLS</span>
        <span class="hud-value" id="hud-cells-val">—</span>
        <svg class="hud-cells-bar" id="hud-cells-bar" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true"></svg>
      </span>
      <span class="hud-cell hud-render-cell" id="hud-render-cell" hidden>
        <span class="hud-label">RENDER</span>
        <span class="hud-value" id="hud-render-val">—</span>
      </span>
      <span class="hud-cell hud-session-trigger" id="hud-session-cell"
            role="button" tabindex="0" aria-haspopup="true"
            aria-controls="session-dropdown"
            title="click to filter by session(s)">
        <span class="hud-label">SESSION</span>
        <span class="hud-value" id="hud-session-val">—</span>
        <span class="hud-caret" aria-hidden="true">▾</span>
      </span>
      <span class="hud-cell hud-theme-trigger" id="hud-theme-cell"
            role="button" tabindex="0" aria-haspopup="true"
            aria-controls="theme-dropdown"
            title="click to switch theme">
        <span class="hud-label">THEME</span>
        <span class="hud-value" id="hud-theme-val">—</span>
        <span class="hud-caret" aria-hidden="true">▾</span>
      </span>
      <span class="hud-cell hud-layout-trigger" id="hud-layout-cell"
            role="button" tabindex="0" aria-haspopup="true"
            aria-controls="layout-dropdown"
            title="click to switch layout">
        <span class="hud-label">LAYOUT</span>
        <span class="hud-value" id="hud-layout-val">GRID</span>
        <span class="hud-caret" aria-hidden="true">▾</span>
      </span>
    </div>
    <div class="hud-row hud-row-bot">
      <span class="hud-cell hud-kills" id="hud-kill1-slot" data-state="ok">
        <svg class="hud-ring" viewBox="0 0 24 24"><circle class="hud-ring-base" cx="12" cy="12" r="10"></circle><circle class="hud-ring-fill" cx="12" cy="12" r="10"></circle></svg>
        <span class="hud-label">KILL.AESTHETIC</span>
        <span class="hud-value" id="hud-kill1-val">—</span>
      </span>
      <span class="hud-cell hud-kills" id="hud-kill2-slot" data-state="ok">
        <svg class="hud-ring" viewBox="0 0 24 24"><circle class="hud-ring-base" cx="12" cy="12" r="10"></circle><circle class="hud-ring-fill" cx="12" cy="12" r="10"></circle></svg>
        <span class="hud-label">KILL.MISROUTE</span>
        <span class="hud-value" id="hud-kill2-val">—</span>
      </span>
      <span class="hud-cell hud-kills" id="hud-kill3-slot" data-state="ok">
        <svg class="hud-ring" viewBox="0 0 24 24"><circle class="hud-ring-base" cx="12" cy="12" r="10"></circle><circle class="hud-ring-fill" cx="12" cy="12" r="10"></circle></svg>
        <span class="hud-label">KILL.HALLUC</span>
        <span class="hud-value" id="hud-kill3-val">—</span>
      </span>
      <span class="hud-cell hud-mints">
        <span class="hud-label">RECENT</span>
        <span class="hud-value" id="hud-recent-val">—</span>
      </span>
    </div>
    <div class="hud-scanline" aria-hidden="true"></div>
  </div>
</header>
<!-- HUD-trigger dropdowns hoisted out of #hud so their position:fixed +
     z-index work against the viewport instead of the HUD's clipped
     stacking context.  When the dropdowns were #hud children, the HUD's
     overflow:hidden + max-height:192px chopped the dropdown rows off below
     the strip (only the header was visible).  The edge-trigger IIFE's
     dropdownOpen guard already keeps the HUD revealed while any dropdown is
     open. -->
<div id="session-dropdown" class="session-dropdown" hidden></div>
<div id="layout-dropdown"  class="session-dropdown" hidden></div>
<div id="theme-dropdown"   class="session-dropdown" hidden></div>
<main id="notebook"></main>
<!-- Inter-cell connections overlay (WebGL via Three.js).
     Replaces the prior SVG implementation. Fixed-position canvas;
     pointer-events:none. The Three.js scene is structured so a future
     VR-loopback (PerspectiveCamera + WebXRManager) is a mechanical
     swap of the camera and renderer, not a rewrite. See
     drawConnections() below. -->
<canvas id="connection-overlay" aria-hidden="true"></canvas>
<!-- Theme furniture / console-overlay layer: a fixed, pointer-events:none
     frame a theme fills with decorative console framing (corner brackets, edge
     bearing scales, registry block). Filled per-theme by mountThemeFurniture();
     empty (invisible) for themes without a furniture builder. Part of the
     theming-flexibility foundation. -->
<div id="theme-furniture" aria-hidden="true"></div>
<script type="module" src="lucida.mjs?v=36"></script>
</body>
</html>
