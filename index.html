<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>lucida notebook</title>
<link rel="stylesheet" href="notebook.css" />
<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
<header>
  <h1>lucida notebook</h1>
  <div id="session-meta"></div>
</header>
<main id="notebook"></main>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
mermaid.initialize({ startOnLoad: false, theme: "neutral" });

async function load() {
  const res = await fetch("cells.json", { cache: "no-store" });
  const data = await res.json();
  document.getElementById("session-meta").textContent =
    `session: ${data.session_id}  ·  cells: ${data.cells.length}`;
  const root = document.getElementById("notebook");
  for (const c of data.cells) {
    root.appendChild(renderCell(c));
  }
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderCell(c) {
  const card = el("article", "cell");
  const head = el("div", "cell-head");
  head.appendChild(el("span", "cell-type", c.cell_type));
  head.appendChild(el("span", "cell-time", c.timestamp || ""));
  card.appendChild(head);

  if (c.trigger_snippet) {
    const trig = el("details", "cell-trigger");
    trig.appendChild(el("summary", null, "trigger snippet"));
    trig.appendChild(el("pre", null, c.trigger_snippet));
    card.appendChild(trig);
  }

  if (c.prompt) {
    const p = el("details", "cell-prompt");
    p.appendChild(el("summary", null, "prompt"));
    p.appendChild(el("pre", null, c.prompt));
    card.appendChild(p);
  }

  const body = el("div", "cell-body");
  card.appendChild(body);

  if (c.cell_type === "image" && c.image_path) {
    const img = el("img");
    img.src = c.image_path;
    img.alt = c.caption || "generated image";
    body.appendChild(img);
  } else if (c.cell_type === "vega" && c.spec) {
    const target = el("div", "vega-target");
    body.appendChild(target);
    vegaEmbed(target, c.spec, { actions: false }).catch(err => {
      target.textContent = "vega render error: " + err.message;
    });
  } else if (c.cell_type === "mermaid" && c.spec) {
    const target = el("div", "mermaid-target");
    body.appendChild(target);
    mermaid.render(`m-${c.id}`, c.spec).then(({ svg }) => {
      target.innerHTML = svg;
    }).catch(err => {
      target.textContent = "mermaid render error: " + err.message;
    });
  } else if (c.cell_type === "html" && c.html) {
    body.innerHTML = c.html;
  } else if (c.cell_type === "text" && c.caption) {
    // caption-only renders below
  } else {
    body.appendChild(el("div", "cell-empty", "(no content for this cell)"));
  }

  if (c.caption) {
    card.appendChild(el("div", "cell-caption", c.caption));
  }

  if (c.notes !== undefined) {
    const n = el("div", "cell-notes");
    n.appendChild(el("strong", null, "notes: "));
    n.appendChild(document.createTextNode(c.notes || "(unrated)"));
    card.appendChild(n);
  }

  return card;
}

load().catch(err => {
  document.getElementById("notebook").textContent =
    "load error: " + err.message;
});
</script>
</body>
</html>
