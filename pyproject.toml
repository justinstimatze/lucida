[project]
name = "lucida"
version = "0.1.0"
description = "Co-evolving notebook of generated artifacts alongside conversation"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "anthropic>=0.39",
]
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
image = [
    "google-genai>=0.3,<3",
    "Pillow>=10.0",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# flat layout — small prototype, no src/ package
packages = ["."]
include = [
    "orchestrator.py", "nano_banana.py", "classifier.py", "image_specialist.py",
    "reflect.py", "evaluator.py", "specialists.py", "segmenter.py", "watcher.py",
    "jsonl_to_transcript.py", "text_evaluator.py",
    "audit_kill_criteria.py", "eval_all_substrates.py",
]

# ============================================================
# Tooling — lifted from claude-mv (pyproject.toml) + drivermap.
# Per memory/python_conventions_adoption.md.
# ============================================================

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "S",     # flake8-bandit (security)
]
ignore = [
    "S101",  # assert — used widely in lucida prototypes
    "S603",  # subprocess-without-shell-check
    "S607",  # start-process-with-partial-path
    "SIM105", # contextlib.suppress — try/except/pass is clearer in places
    "SIM108", # ternary — explicit if/else often clearer
    "E501",  # line length — handled by formatter
    "UP015", # unnecessary open mode "r" — explicit is fine
    "S311",  # random for non-crypto — fine for hash-key generation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts + hardcoded passwords are fine in tests
# System prompts use × for matrix dimensions (e.g. "3×2 table") — not ambiguous identifiers
"classifier.py" = ["RUF001"]
"specialists.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
# Lucida is a prototype with several un-typed corners (LLM SDK responses,
# untyped JSON dicts). Start permissive, tighten over time. claude-mv runs
# strict; lucida earns its way there.
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # too noisy for now; flip when typing catches up
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "integration: mark test as requiring live API access (ANTHROPIC_API_KEY)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "scratch_*.py",
    "research/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
