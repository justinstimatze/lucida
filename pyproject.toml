[project]
name = "lucida"
version = "0.0.1"
description = "Co-evolving notebook of generated artifacts alongside conversation"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3",
    "python-dotenv>=1.0",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# flat layout — small prototype, no src/ package
packages = ["."]
include = ["orchestrator.py", "nano_banana.py", "classifier.py", "image_specialist.py", "reflect.py"]
